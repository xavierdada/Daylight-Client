org.gradle.jvmargs=-Xmx8g -XX:+UseParallelGC
org.gradle.daemon=true
org.gradle.workers.max=12

# This project must build and run on JDK 8.
#  - ForgeGradle 2.1 unpacks Forge's binary patches with java.util.jar.Pack200, removed
#    from the JDK in 14.
#  - launchwrapper casts the class loader to URLClassLoader, which is not what Java 9+
#    hands out, so runClient dies on a newer JVM.
# Pinned here so no terminal or IDE has to set JAVA_HOME. Change the path if your JDK 8
# lives elsewhere; use forward slashes, a properties file treats "\" as an escape.
org.gradle.java.home=C:/Users/HP/.jdks/jdk8u504-b01
#
# Deliberately NOT enabled: configureondemand, parallel, caching.
# ForgeGradle 2.1 wires its forgeBin/AT artifacts at configuration time and is known
# to misbehave under configure-on-demand, parallel execution and the build cache.
# Upstream LiquidBounce (same fork) sets only org.gradle.jvmargs.

mod_version=b1.1
maven_group=net.aspw
archives_base_name=daylight

mixin_version=0.7.11-SNAPSHOT
kotlin_version = 1.9.23
detekt_version = 1.23.6
mixingradle_version = ae2a80e

# Where the patched ForgeGradle needed for MC 1.8.9 on Gradle 6.9.1 comes from.
#
# JitPack serves one build record per version string, and for commit
# a3d86a59c08c471c8a9b822642d0b7ce71ff4455 only some spellings have artifacts:
#   a3d86a59c0   -> HTTP 404, do NOT use (upstream LiquidBounce still pins this)
#   a3d86a59c08  -> works, this is the same commit
# If this ever breaks again, run tools/fix-forgegradle.ps1: it probes the other
# spellings of the commit and falls back to a local source build if none work.
#   local fallback: net.minecraftforge.gradle:ForgeGradle:2.1
forgegradle_coordinate = com.github.ccbluex:ForgeGradle:a3d86a59c08

okhttp_version=4.9.1
